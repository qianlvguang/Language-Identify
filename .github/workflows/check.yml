name: 代码与发布产物检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 语法检查
        run: python3 -m compileall -q scripts
      - name: 语言清单和公开产物检查
        run: python3 scripts/validate_release.py
